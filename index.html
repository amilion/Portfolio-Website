    <!-- Open Graph -->

    <meta property="og:title" content="Amirreza Ahadzadeh — Software Engineer" />
    <meta property="og:description" content="Final-year CS student at the University of Tehran (GPA 19.0/20) and software engineer specialising in Python, ML, and full-stack REST development." />

    <!-- Twitter Card -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Inline script prevents flash of unstyled content (FOUC) for dark mode.
      Runs synchronously before React mounts so the class is set before first paint.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
